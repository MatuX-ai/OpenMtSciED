<div class="sidebar-container" [class.is-collapsed]="isCollapsed">
  <!-- Logo & Brand -->
  <div class="brand">
    <img src="assets/images/matu-logo.png" alt="Logo" class="brand-logo" *ngIf="!isCollapsed" />
    <span class="brand-text" *ngIf="!isCollapsed">OpenMTSciEd</span>
    <button mat-icon-button (click)="toggleSidebar()" class="toggle-btn">
      <i [class]="isCollapsed ? 'ri-arrow-right-s-line' : 'ri-arrow-left-s-line'"></i>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="nav-menu">
    <a
      *ngFor="let item of menuItems"
      mat-list-item
      [routerLink]="item.route"
      routerLinkActive="active-link"
      [matTooltip]="isCollapsed ? item.label : ''"
      matTooltipPosition="right"
      class="nav-item"
    >
      <i [class]="item.icon" class="nav-icon"></i>
      <span matListItemTitle *ngIf="!isCollapsed">{{ item.label }}</span>
    </a>
  </nav>

  <!-- 资源关系说明卡片 -->
  <div class="resource-info-card" *ngIf="!isCollapsed" [class.is-minimized]="isInfoMinimized">
    <div class="info-header">
      <div class="header-left">
        <i class="ri-information-line"></i>
        <span>资源关系说明</span>
      </div>
      <button mat-icon-button class="minimize-btn" (click)="toggleInfoCard()" [matTooltip]="isInfoMinimized ? '展开' : '折叠'">
        <i [class]="isInfoMinimized ? 'ri-arrow-up-s-line' : 'ri-arrow-down-s-line'"></i>
      </button>
    </div>
    <div class="info-content" *ngIf="!isInfoMinimized">
      <div class="info-item">
        <div class="info-icon course">
          <i class="ri-book-2-line"></i>
        </div>
        <div class="info-text">
          <strong>课程</strong>
          <p>教学大纲与学习计划</p>
        </div>
      </div>
      <div class="info-arrow">
        <i class="ri-arrow-down-line"></i>
      </div>
      <div class="info-item">
        <div class="info-icon tutorial">
          <i class="ri-graduation-cap-line"></i>
        </div>
        <div class="info-text">
          <strong>教程</strong>
          <p>详细步骤与知识讲解</p>
        </div>
      </div>
      <div class="info-arrow">
        <i class="ri-arrow-down-line"></i>
      </div>
      <div class="info-item">
        <div class="info-icon material">
          <i class="ri-file-text-line"></i>
        </div>
        <div class="info-text">
          <strong>课件</strong>
          <p>PPT、文档、视频等素材</p>
        </div>
      </div>
      <div class="info-arrow">
        <i class="ri-arrow-down-line"></i>
      </div>
      <div class="info-item">
        <div class="info-icon question">
          <i class="ri-question-line"></i>
        </div>
        <div class="info-text">
          <strong>题库</strong>
          <p>练习题与知识点巩固</p>
        </div>
      </div>
    </div>
    <div class="info-footer" *ngIf="!isInfoMinimized">
      <i class="ri-lightbulb-line"></i>
      <span>课程→教程→课件→题库</span>
    </div>
    <div class="minimized-hint" *ngIf="isInfoMinimized">
      <i class="ri-question-mark"></i>
    </div>
  </div>
</div>
